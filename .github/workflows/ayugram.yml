name: AyuGram iOS build

on:
  push:
    branches: [ ayu ]
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Submodules (relative URLs point at the fork, use upstream TelegramMessenger)
        env:
          # wallet-engine keeps its UI-test snapshot PNGs in Git LFS, and fetching them now fails
          # ("smudge filter lfs failed"). The build does not use them, so LFS files stay pointers.
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          git config -f .gitmodules submodule.submodules/TgVoipWebrtc/tgcalls.url https://github.com/TelegramMessenger/tgcalls.git
          git submodule sync --recursive
          # Shallow clones (webrtc's full history is huge) with retries. Errors go to annotations,
          # which are readable without signing in, unlike the job log.
          echo "::notice::disk before submodules: $(df -h . | tail -1)"
          ok=0
          for attempt in 1 2 3; do
            if git submodule update --init --recursive --jobs 4 --depth 1 > submodules.log 2>&1; then ok=1; break; fi
            echo "::warning::submodules attempt $attempt failed: $(grep -iE 'fatal|error|denied|not our ref|space' submodules.log | tail -4 | tr '\n' ' ')"
            sleep 30
          done
          if [ "$ok" != 1 ]; then
            echo "::error::submodules failed: $(grep -iE 'fatal|error|denied|not our ref|space' submodules.log | tail -6 | tr '\n' ' ') | disk: $(df -h . | tail -1)"
            exit 1
          fi

      - name: Select Xcode 27.1 (versions.json)
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version

      - name: Canonical source dir
        run: |
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Write configuration (own api_id from secrets)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          cd /Users/Shared/telegram-ios
          test -n "$TG_API_ID" && test -n "$TG_API_HASH" || { echo "Add TG_API_ID and TG_API_HASH repo secrets"; exit 1; }
          python3 - <<'PY'
          import json, os
          c = json.load(open("build-system/appstore-configuration.json"))
          c["api_id"] = os.environ["TG_API_ID"]
          c["api_hash"] = os.environ["TG_API_HASH"]
          c["is_appstore_build"] = "false"
          c["enable_siri"] = False
          c["enable_icloud"] = False
          json.dump(c, open("ayu-configuration.json", "w"), indent=1)
          PY

      - name: Refresh expired fake provisioning profiles (upstream ones ran out 30 Oct 2026)
        run: |
          set -e
          cd /Users/Shared/telegram-ios/build-system/fake-codesigning
          OSSL=/opt/homebrew/opt/openssl@3/bin/openssl; [ -x "$OSSL" ] || OSSL=openssl
          T=$(mktemp -d)
          $OSSL pkcs12 -in certs/SelfSigned.p12 -passin pass: -nodes -legacy -out $T/id.pem 2>/dev/null || $OSSL pkcs12 -in certs/SelfSigned.p12 -passin pass: -nodes -out $T/id.pem
          for p in profiles/*.mobileprovision; do
            security cms -D -i "$p" -o $T/p.plist
            plutil -replace ExpirationDate -date 2036-01-01T00:00:00Z $T/p.plist
            $OSSL cms -sign -nodetach -binary -outform DER -signer $T/id.pem -in $T/p.plist -out "$p"
            echo "$p: $(security cms -D -i "$p" | plutil -extract ExpirationDate raw -o - -)"
          done

      - name: Restore Bazel disk cache (each run continues where the last one stopped)
        uses: actions/cache/restore@v4
        with:
          path: /Users/runner/bazel-disk-cache
          key: ayu-bazel-${{ github.run_id }}
          restore-keys: ayu-bazel-

      - name: Build unsigned IPA
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          cd /Users/Shared/telegram-ios
          BUILD_NUMBER="$(( $(git rev-list --count HEAD) + $(cat build_number_offset) ))"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          # TelegramCore's compiler output (mostly warnings) is ~1.7 MB, over bazel's 1 MB default,
          # and bazel then prints none of it: the error is hidden. A UI flag, not an action key.
          echo 'build --experimental_ui_max_stdouterr_bytes=-1' >> .bazelrc
          set +e
          # soft stop at 105 min so the log tail and the disk cache get saved before the runner cuts the job
          ( sleep 6300; echo "ERROR: soft time limit reached, stopping bazel"; pkill -INT -f bazel-9; sleep 60; pkill -f bazel-9; pkill -f Make.py ) &
          WATCHDOG=$!
          {
            python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs &&
            python3 -u build-system/Make/Make.py --overrideXcodeVersion --cacheDir=/Users/runner/bazel-disk-cache               --bazelUserRoot="/private/var/tmp/_bazel_containerhost"               build               --configurationPath="ayu-configuration.json"               --codesigningInformationPath=build-system/fake-codesigning               --configuration=release_arm64               --buildNumber="$BUILD_NUMBER"
          } 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          kill $WATCHDOG 2>/dev/null
          echo "::notice title=progress::rc=$rc last=$(grep -oE '[[0-9,]+ / [0-9,]+]' /tmp/build.log | tail -1) lines=$(wc -l < /tmp/build.log)"
          grep -E '(error:|ERROR:|FAILED|fatal)' /tmp/build.log | tail -5 | sed 's/^/::warning title=tail::/'
          if [ "$rc" -ne 0 ]; then
            # public annotations (logs need sign-in): key error lines + the last lines, secrets stripped
            python3 - <<'PY'
          import os, re
          t = open("/tmp/build.log", errors="replace").read()
          for k in ("TG_API_HASH", "TG_API_ID"):
              v = os.environ.get(k)
              if v: t = t.replace(v, "***")
          def ann(title, ls):
              m = chr(10).join(ls)[-20000:].replace("%", "%25").replace(chr(13), "%0D").replace(chr(10), "%0A")
              print("::error title=%s::%s" % (title, m))
          # Swift colours its diagnostics, which splits "error" from ":" with escape codes.
          t = re.sub(chr(27) + r"\[[0-9;]*[A-Za-z]", "", t)
          lines = [l for l in t.splitlines() if l.strip()]
          errs = [l for l in lines if re.search(r"(error:|ERROR:|Error:|FAILED|fatal)", l)][-25:]
          # Each compiler error with the source lines Swift prints under it.
          diags = []
          for i, l in enumerate(lines):
              if re.search(r"\.(swift|m|mm|h|c|cpp):\d+:\d+: error:", l) and l not in diags:
                  diags.extend(lines[i:i + 6])
                  diags.append("----")
          if diags:
              ann("compiler errors", diags[:240])
          # What a failed action printed after bazel's ERROR line, without the echoed command.
          after = []
          for i, l in enumerate(lines):
              if l.startswith("ERROR:") and "failed" in l:
                  for k in lines[i + 1:i + 400]:
                      if k.startswith((" ", "	")) and ("=" in k or k.strip().startswith(("-", "exec ", "(cd", "bazel-out", "external/"))):
                          continue
                      if k.startswith(("[", "INFO:", "ERROR: Build", "Target ")):
                          continue
                      after.append(k[:400])
                  break
          ann("after ERROR", after[:120] or ["(nothing)"])
          # Source snippets Swift prints (" 404 | code") with the lines above them.
          snips = []
          for i, l in enumerate(lines):
              if re.match(r"^\s*\d+ \|", l) and len(snips) < 200:
                  snips.extend(x[:400] for x in lines[max(0, i - 3):i + 2])
                  snips.append("----")
          if snips:
              ann("snippets", snips)
          ann("error lines", errs or ["(none matched)"])
          ann("last 60 lines", lines[-60:])
          PY
            exit $rc
          fi
          set -e
          mkdir -p build/artifacts
          IPA=$(find -L bazel-out/ -path "*/bin/Telegram/Telegram.ipa" -type f 2>/dev/null | head -1)
          echo "::notice title=ipa::${IPA:-not found}"
          if [ -z "$IPA" ]; then find -L bazel-out/ -name "*.ipa" -maxdepth 6 2>/dev/null | head -5 | sed 's/^/::warning title=ipa candidates::/'; exit 1; fi
          cp "$IPA" build/artifacts/AyuGram.ipa
          ls -la build/artifacts

      - name: Save Bazel disk cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /Users/runner/bazel-disk-cache
          key: ayu-bazel-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: AyuGram-ipa-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/AyuGram.ipa
          retention-days: 14
